# Production profile — active when the environment variable SPRING_PROFILES_ACTIVE=prod (set on Render).
#
# Nothing secret lives in this file. Every value below comes from an environment variable set in the
# Render dashboard. If one is missing, the app refuses to start and the log says exactly which one
# ("Could not resolve placeholder 'DB_URL'") instead of silently falling back to localhost.

# ---- Database (Aiven MySQL) ----
# DB_URL must be the JDBC form, NOT the mysql:// URI Aiven shows:
#   jdbc:mysql://<host>:<port>/<database>?sslMode=REQUIRED
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Small pool: free-tier hosts and free-tier databases both have tight connection limits.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# 'update' makes Hibernate inspect every table over the network on each start, which costs a minute on a
# free Render instance. Once the tables exist, set DDL_AUTO=none on Render for a much faster start.
# Set it back to update (or run the reset script) whenever the entities change.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ---- Auth ----
# At least 32 characters. Generate one — see DEPLOY.md.
app.jwt.secret=${JWT_SECRET}

# ---- CORS ----
# Exact origin of the deployed frontend, no trailing slash, e.g. https://calculon-azfa.onrender.com
# Several origins: separate with commas.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS}
