spring.application.name=calculon-backend
server.port=8080

# Active profile: 'dev' uses in-memory H2 (zero setup), 'prod' uses MySQL.
spring.profiles.active=dev

# ---- MySQL (used in prod profile) ----
spring.datasource.url=jdbc:mysql://localhost:3306/calculon?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
app.jwt.secret=change-this-to-a-long-random-secret-in-production-please-0123456789
app.jwt.expiration-ms=86400000

# ---- CORS ----
# Pattern-based so any localhost port works in dev. In production (e.g. Render), override
# this via the APP_CORS_ALLOWED_ORIGIN_PATTERNS environment variable to your deployed
# frontend's exact origin, e.g. https://calculon-azfa.onrender.com
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
