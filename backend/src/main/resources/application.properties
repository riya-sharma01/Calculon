spring.application.name=calculon-backend

# Hosts like Render tell the app which port to listen on through the PORT environment variable.
# Locally PORT is unset, so this falls back to 8080.
server.port=${PORT:8080}

# Active profile: 'dev' = in-memory H2 (zero setup, for local work).
#                 'prod' = MySQL on Aiven, configured in application-prod.properties.
# On Render, set the environment variable SPRING_PROFILES_ACTIVE=prod — it overrides this line.
spring.profiles.active=dev

# ---- Local-MySQL defaults (NOT used by 'dev', which runs on H2; fully overridden by 'prod') ----
spring.datasource.url=jdbc:mysql://localhost:3306/calculon?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
# DEV-ONLY placeholder. The 'prod' profile ignores this and requires the JWT_SECRET environment variable.
app.jwt.secret=change-this-to-a-long-random-secret-in-production-please-0123456789
app.jwt.expiration-ms=86400000

# ---- CORS ----
# Pattern-based so any localhost port works in dev. The 'prod' profile requires the
# CORS_ALLOWED_ORIGINS environment variable (your deployed frontend's exact origin).
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
